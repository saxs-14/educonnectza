<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Controls | EduConnectZA Dev Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/dev-shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    * { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 antialiased">
  <nav class="gradient-bg text-white shadow-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-white p-2 rounded-xl shadow-inner"><i class="fas fa-server text-blue-800 text-lg"></i></div>
          <span class="font-bold tracking-tight">System Controls</span>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <!-- GLOBAL TABS -->
    <div class="global-tab-bar mb-8">
      <a href="dev-admin-dashboard.html" class="global-tab"><i class="fas fa-th-large"></i> Overview</a>
      <a href="dev-user-management.html" class="global-tab"><i class="fas fa-users"></i> Users</a>
      <a href="dev-school-management.html" class="global-tab"><i class="fas fa-school"></i> Schools</a>
      <a href="dev-ai-insights.html" class="global-tab"><i class="fas fa-brain"></i> AI Audit</a>
      <a href="dev-system-controls.html" class="global-tab active"><i class="fas fa-server"></i> System</a>
      <a href="dev-content-management.html" class="global-tab"><i class="fas fa-book"></i> Content</a>
      <a href="dev-database-explorer.html" class="global-tab"><i class="fas fa-database"></i> Database</a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Scalability Section -->
        <div class="glass-card p-8 rounded-[2.5rem] animate-fade-in">
            <h2 class="text-2xl font-black text-slate-900 mb-6 flex items-center gap-3">
                <i class="fas fa-chart-line text-indigo-600"></i> Cluster Scalability
            </h2>
            <div class="space-y-6">
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Active Cluster</span>
                        <span id="clusterName" class="text-sm font-bold text-slate-900">ZA-CPT-01</span>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm font-medium">
                            <span>CPU Utilization</span>
                            <span id="cpuLoad" class="text-indigo-600">--%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                            <div id="cpuBar" class="bg-indigo-600 h-full transition-all duration-1000" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Min Replicas</label>
                        <input type="number" id="minPods" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Max Replicas</label>
                        <input type="number" id="maxPods" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition font-bold">
                    </div>
                </div>

                <button id="applyScalingBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:shadow-xl transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Apply Cluster Configuration
                </button>
            </div>
        </div>

        <!-- Rollback & Versioning Section -->
        <div class="glass-card p-8 rounded-[2.5rem] animate-fade-in" style="animation-delay: 0.1s">
            <h2 class="text-2xl font-black text-slate-900 mb-6 flex items-center gap-3">
                <i class="fas fa-undo-alt text-amber-600"></i> Deployment History
            </h2>
            <div class="space-y-4">
                <div id="currentVersionCard" class="bg-emerald-50 border border-emerald-100 p-6 rounded-2xl">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mb-1">Current Version</p>
                            <h3 id="currentVersion" class="text-2xl font-black text-emerald-900">v--</h3>
                        </div>
                        <span class="px-3 py-1 bg-emerald-500 text-white text-[10px] font-bold rounded-full">ACTIVE</span>
                    </div>
                    <p class="text-xs text-emerald-700 mt-2">Status: Stable • Optimized for High Load</p>
                </div>

                <div id="deploymentHistory" class="space-y-3">
                    <!-- Dynamic history items -->
                </div>
            </div>
        </div>
    </div>
  </main>

  <script type="module" src="src/js/pages/dev-system.js"></script>
</body>
</html>
