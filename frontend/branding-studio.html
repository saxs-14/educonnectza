<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnectZA - Branding Studio | Professional Identity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');

    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #10b981;
    }

    * {
      font-family: 'Outfit', sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .preview-window {
      border: 8px solid #1e293b;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      background: #f8fafc;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gradient-bg {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    /* Animations */
    @keyframes slideInUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-slide-up {
      animation: slideInUp 0.6s ease-out forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-900">

  <!-- Main Navigation -->
  <nav class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-20 items-center">
        <div class="flex items-center gap-4">
          <div class="p-3 bg-indigo-600 rounded-2xl shadow-lg shadow-indigo-100">
            <i class="fas fa-palette text-white text-xl"></i>
          </div>
          <div>
            <h1 class="font-black text-2xl tracking-tight text-slate-900">Branding Studio</h1>
            <p class="text-[10px] uppercase tracking-[0.2em] font-bold text-slate-400">Institutional Identity Management
            </p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <a href="dev-admin-dashboard.html"
            class="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition-all flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> Dashboard
          </a>
          <button id="saveBrandingBtn"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-indigo-200 flex items-center gap-2">
            <i class="fas fa-cloud-upload-alt"></i> Sync & Save Changes
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">

      <!-- Left Panel: Controls -->
      <div class="lg:col-span-4 space-y-8 animate-slide-up">

        <!-- School Selection (only for DevAdmin) -->
        <div id="schoolSelector" class="hidden glass-card p-6 rounded-[2rem] shadow-xl border border-slate-100">
          <label class="text-xs font-black text-slate-400 uppercase tracking-widest block mb-4">Select
            Institution</label>
          <select id="schoolBrandSelect"
            class="w-full bg-slate-100 border-none rounded-2xl px-5 py-4 text-sm font-bold focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="">Choose a school...</option>
          </select>
        </div>

        <!-- Visual Identity -->
        <div class="glass-card p-8 rounded-[2rem] shadow-xl border border-slate-100 space-y-8">
          <h2 class="text-xl font-extrabold flex items-center gap-3">
            <span class="p-2 bg-amber-100 text-amber-600 rounded-lg"><i class="fas fa-eye"></i></span>
            Visual Identity
          </h2>

          <!-- Colors -->
          <div class="space-y-6">
            <div>
              <div class="flex justify-between items-end mb-3">
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest">Primary Color</label>
                <span id="primaryHex" class="text-xs font-mono font-bold text-slate-500">#1E3A8A</span>
              </div>
              <div class="flex gap-3">
                <input type="color" id="primaryColorPicker" value="#1e3a8a"
                  class="w-full h-14 rounded-2xl cursor-pointer border-4 border-white shadow-inner bg-slate-100">
              </div>
            </div>

            <div>
              <div class="flex justify-between items-end mb-3">
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest">Secondary Color</label>
                <span id="secondaryHex" class="text-xs font-mono font-bold text-slate-500">#10B981</span>
              </div>
              <div class="flex gap-3">
                <input type="color" id="secondaryColorPicker" value="#10b981"
                  class="w-full h-14 rounded-2xl cursor-pointer border-4 border-white shadow-inner bg-slate-100">
              </div>
            </div>
          </div>

          <!-- Logo Upload -->
          <div class="space-y-4">
            <label class="text-xs font-black text-slate-400 uppercase tracking-widest">Institutional Logo</label>
            <div class="relative group">
              <input type="file" id="schoolLogoUpload" accept="image/*"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <div
                class="border-2 border-dashed border-slate-200 rounded-3xl p-8 text-center group-hover:border-indigo-400 group-hover:bg-indigo-50/50 transition-all">
                <i class="fas fa-image text-3xl text-slate-300 mb-3 group-hover:text-indigo-400 transition-colors"></i>
                <p class="text-sm font-bold text-slate-500">Drag logo or <span class="text-indigo-600">Browse</span></p>
                <p class="text-[10px] text-slate-400 mt-1">Recommended: PNG with transparent background</p>
              </div>
            </div>
            <div id="logoStatus" class="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl hidden">
              <img id="logoPreviewImg" src="" class="h-10 w-auto object-contain rounded-lg">
              <div class="flex-1">
                <p id="logoFileName" class="text-xs font-bold text-slate-700 truncate">logo.png</p>
                <p class="text-[10px] text-emerald-600 font-bold">Ready to upload</p>
              </div>
              <button id="removeLogoBtn" class="text-slate-400 hover:text-red-500 transition-colors"><i
                  class="fas fa-times-circle"></i></button>
            </div>
          </div>
        </div>

        <!-- Presets -->
        <div class="glass-card p-8 rounded-[2rem] shadow-xl border border-slate-100">
          <label class="text-xs font-black text-slate-400 uppercase tracking-widest block mb-5">Quick Color
            Presets</label>
          <div class="grid grid-cols-4 gap-4">
            <button
              class="preset-btn w-full aspect-square rounded-2xl border-4 border-white shadow-sm hover:scale-110 transition-transform"
              style="background: #1e3a8a;" data-primary="#1e3a8a" data-secondary="#10b981"></button>
            <button
              class="preset-btn w-full aspect-square rounded-2xl border-4 border-white shadow-sm hover:scale-110 transition-transform"
              style="background: #7c3aed;" data-primary="#7c3aed" data-secondary="#db2777"></button>
            <button
              class="preset-btn w-full aspect-square rounded-2xl border-4 border-white shadow-sm hover:scale-110 transition-transform"
              style="background: #059669;" data-primary="#059669" data-secondary="#d97706"></button>
            <button
              class="preset-btn w-full aspect-square rounded-2xl border-4 border-white shadow-sm hover:scale-110 transition-transform"
              style="background: #dc2626;" data-primary="#dc2626" data-secondary="#2563eb"></button>
          </div>
        </div>
      </div>

      <!-- Right Panel: Previews -->
      <div class="lg:col-span-8 space-y-8">

        <!-- Tab Switching for Previews -->
        <div class="flex bg-slate-200/50 p-1.5 rounded-2xl w-fit mx-auto shadow-inner">
          <button data-view="admin"
            class="view-tab-btn py-3 px-8 rounded-xl text-sm font-black transition-all bg-white shadow-lg text-indigo-600">
            <i class="fas fa-user-shield mr-2"></i> Admin
          </button>
          <button data-view="teacher"
            class="view-tab-btn py-3 px-8 rounded-xl text-sm font-black transition-all text-slate-500 hover:text-slate-800">
            <i class="fas fa-chalkboard-teacher mr-2"></i> Teacher
          </button>
          <button data-view="learner"
            class="view-tab-btn py-3 px-8 rounded-xl text-sm font-black transition-all text-slate-500 hover:text-slate-800">
            <i class="fas fa-user-graduate mr-2"></i> Learner
          </button>
        </div>

        <!-- The Preview Container -->
        <div class="relative group">
          <div
            class="absolute -inset-4 bg-gradient-to-r from-indigo-500/20 to-purple-500/20 rounded-[3rem] blur-2xl opacity-50 group-hover:opacity-100 transition duration-1000">
          </div>

          <div class="preview-window aspect-video relative z-10 bg-white">
            <!-- Mock Header -->
            <div id="previewHeader" class="h-16 px-6 flex justify-between items-center text-white gradient-bg">
              <div class="flex items-center gap-3">
                <img id="previewLogo" src="https://placehold.co/100x40/white/blue?text=Logo"
                  class="h-8 w-auto bg-white/20 p-1 rounded backdrop-blur">
                <span id="previewSchoolName" class="font-black text-sm tracking-tight">Institutional Dashboard</span>
              </div>
              <div class="flex items-center gap-4">
                <div class="w-8 h-8 rounded-full bg-white/20"></div>
                <div class="h-4 w-12 bg-white/20 rounded"></div>
              </div>
            </div>

            <!-- Mock Content -->
            <div class="p-8 space-y-6">
              <div class="flex justify-between items-center">
                <div class="space-y-1">
                  <div id="previewTitle" class="h-6 w-48 bg-slate-100 rounded-lg"></div>
                  <div class="h-3 w-32 bg-slate-50 rounded-lg"></div>
                </div>
                <div id="previewBadge"
                  class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest text-white gradient-bg">
                  Live Status</div>
              </div>

              <div class="grid grid-cols-3 gap-6">
                <div class="aspect-video bg-slate-50 rounded-3xl p-6 space-y-4 border border-slate-100">
                  <div class="h-10 w-10 rounded-2xl gradient-bg opacity-20"></div>
                  <div class="h-8 w-2/3 bg-slate-200 rounded-lg"></div>
                  <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full gradient-bg w-3/4"></div>
                  </div>
                </div>
                <div class="aspect-video bg-slate-50 rounded-3xl p-6 space-y-4 border border-slate-100">
                  <div class="h-10 w-10 rounded-2xl gradient-bg opacity-20"></div>
                  <div class="h-8 w-2/3 bg-slate-200 rounded-lg"></div>
                  <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full gradient-bg w-1/2"></div>
                  </div>
                </div>
                <div class="aspect-video bg-slate-50 rounded-3xl p-6 space-y-4 border border-slate-100">
                  <div class="h-10 w-10 rounded-2xl gradient-bg opacity-20"></div>
                  <div class="h-8 w-2/3 bg-slate-200 rounded-lg"></div>
                  <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full gradient-bg w-5/6"></div>
                  </div>
                </div>
              </div>

              <div class="h-48 bg-slate-50 rounded-[2rem] border border-slate-100 p-8">
                <div class="flex gap-4 h-full items-end">
                  <div class="flex-1 gradient-bg opacity-30 rounded-t-xl h-[40%]"></div>
                  <div class="flex-1 gradient-bg opacity-50 rounded-t-xl h-[70%]"></div>
                  <div class="flex-1 gradient-bg opacity-70 rounded-t-xl h-[90%]"></div>
                  <div class="flex-1 gradient-bg opacity-40 rounded-t-xl h-[50%]"></div>
                  <div class="flex-1 gradient-bg opacity-60 rounded-t-xl h-[80%]"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- View Labels -->
          <div class="mt-6 flex justify-center gap-10">
            <div class="flex items-center gap-2 text-xs font-bold text-slate-400">
              <span class="color-dot gradient-bg"></span> Navigations & Headers
            </div>
            <div class="flex items-center gap-2 text-xs font-bold text-slate-400">
              <span class="color-dot gradient-bg opacity-50"></span> Progress & Accents
            </div>
            <div class="flex items-center gap-2 text-xs font-bold text-slate-400">
              <span class="color-dot gradient-bg opacity-20"></span> Background Highlights
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="src/js/pages/branding-studio.js"></script>
</body>

</html>
