<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Management | EduConnectZA Dev Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/dev-shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    * { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 antialiased">
  <nav class="gradient-bg text-white shadow-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-white p-2 rounded-xl shadow-inner"><i class="fas fa-book-open text-blue-800 text-lg"></i></div>
          <span class="font-bold tracking-tight">Academic Content Management</span>
        </div>
        <button id="addContentBtn" class="bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
          <i class="fas fa-plus"></i> New Global Resource
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <!-- GLOBAL TABS -->
    <div class="global-tab-bar mb-8">
      <a href="dev-admin-dashboard.html" class="global-tab"><i class="fas fa-th-large"></i> Overview</a>
      <a href="dev-user-management.html" class="global-tab"><i class="fas fa-users"></i> Users</a>
      <a href="dev-school-management.html" class="global-tab"><i class="fas fa-school"></i> Schools</a>
      <a href="dev-ai-insights.html" class="global-tab"><i class="fas fa-brain"></i> AI Audit</a>
      <a href="dev-system-controls.html" class="global-tab"><i class="fas fa-server"></i> System</a>
      <a href="dev-content-management.html" class="global-tab active"><i class="fas fa-book"></i> Content</a>
      <a href="dev-database-explorer.html" class="global-tab"><i class="fas fa-database"></i> Database</a>
    </div>

    <div class="grid grid-cols-1 gap-8">
        <!-- Content List -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
            <div class="responsive-table-container">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200">
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Resource Title</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Type</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Grade/Subject</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Status</th>
                            <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contentTableBody">
                        <tr><td colspan="5" class="px-6 py-10 text-center text-slate-400">Syncing with global library...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
  </main>

  <!-- Add Content Modal -->
  <div id="contentModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-8 shadow-2xl relative">
      <button id="closeModal" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
      <h2 class="text-2xl font-black text-slate-900 mb-6">New Global Resource</h2>
      <form id="contentForm" class="space-y-4">
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Title</label>
          <input type="text" id="title" required class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none" placeholder="e.g. NSC Mathematics 2024 P1">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Type</label>
              <select id="type" required class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none">
                <option value="Past Paper">Past Paper</option>
                <option value="Pacing Guide">Pacing Guide</option>
                <option value="Study Guide">Study Guide</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Grade</label>
              <input type="number" id="grade" required class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none" value="12">
            </div>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Subject</label>
          <input type="text" id="subject" required class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none" placeholder="e.g. Mathematics">
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Resource URL</label>
          <input type="url" id="url" required class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none" placeholder="https://...">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold transition-all shadow-lg shadow-blue-100">Publish to All Schools</button>
      </form>
    </div>
  </div>

  <script type="module" src="src/js/pages/dev-content.js"></script>
</body>
</html>
