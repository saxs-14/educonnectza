<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI System Insights | EduConnectZA Dev Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/dev-shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    * { font-family: 'Outfit', sans-serif; }
    .scan-pulse { animation: scan 2s linear infinite; }
    @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
  </style>
</head>
<body class="bg-slate-50 antialiased">
  <nav class="gradient-bg text-white shadow-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-white p-2 rounded-xl shadow-inner">
            <i class="fas fa-brain text-blue-800 text-lg"></i>
          </div>
          <span class="font-bold tracking-tight">AI System Audit</span>
        </div>
        <div id="scanStatus" class="hidden flex items-center px-3 py-1 bg-emerald-800/50 rounded-full text-[10px] text-emerald-100 border border-emerald-700">
          <span class="h-2 w-2 bg-emerald-400 rounded-full mr-2 animate-pulse"></span>
          AI Analyzer Active
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    
    <!-- GLOBAL TABS -->
    <div class="global-tab-bar mb-8">
      <a href="dev-admin-dashboard.html" class="global-tab"><i class="fas fa-th-large"></i> Overview</a>
      <a href="dev-user-management.html" class="global-tab"><i class="fas fa-users"></i> Users</a>
      <a href="dev-school-management.html" class="global-tab"><i class="fas fa-school"></i> Schools</a>
      <a href="dev-ai-insights.html" class="global-tab active"><i class="fas fa-brain"></i> AI Audit</a>
      <a href="dev-system-controls.html" class="global-tab"><i class="fas fa-server"></i> System</a>
      <a href="dev-content-management.html" class="global-tab"><i class="fas fa-book"></i> Content</a>
      <a href="dev-database-explorer.html" class="global-tab"><i class="fas fa-database"></i> Database</a>
    </div>

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
      <div>
        <h1 class="text-4xl font-black text-slate-900 tracking-tight">🧠 AI System Audit</h1>
        <p class="text-slate-500 mt-2 text-lg">Predictive analytics and database integrity oversight.</p>
      </div>
      <button id="runScanBtn" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3">
        <i class="fas fa-microscope"></i> Run Deep System Scan
      </button>
    </div>

    <!-- Health Score -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
      <div class="lg:col-span-1 glass-card p-8 rounded-[2.5rem] flex flex-col items-center justify-center text-center animate-fade-in">
        <div class="relative w-40 h-40 flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90">
            <circle cx="80" cy="80" r="70" stroke="currentColor" stroke-width="12" fill="transparent" class="text-slate-100"/>
            <circle id="healthCircle" cx="80" cy="80" r="70" stroke="currentColor" stroke-width="12" fill="transparent" stroke-dasharray="440" stroke-dashoffset="44" class="text-indigo-600 transition-all duration-1000"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="healthScore" class="text-5xl font-black text-slate-900">--</span>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Health Score</span>
          </div>
        </div>
        <p class="mt-6 text-xs text-slate-500 font-medium">Last full scan: <span id="lastScanTime" class="text-slate-900 font-bold">Never</span></p>
      </div>

      <div class="lg:col-span-2 glass-card p-8 rounded-[2.5rem] relative overflow-hidden animate-fade-in" style="animation-delay: 0.1s">
        <div id="scanningOverlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
          <div class="w-64 h-1 bg-slate-100 rounded-full relative overflow-hidden">
            <div class="absolute top-0 left-0 h-full bg-indigo-600 scan-pulse w-full"></div>
          </div>
          <p class="mt-4 font-bold text-indigo-600 animate-pulse">AI is analyzing database integrity...</p>
        </div>
        <h3 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-lightbulb text-amber-500"></i> AI Strategic Insights</h3>
        <div id="insightsList" class="space-y-4">
          <div class="animate-pulse flex space-x-4">
            <div class="flex-1 space-y-4 py-1">
              <div class="h-4 bg-slate-200 rounded w-3/4"></div>
              <div class="h-4 bg-slate-200 rounded"></div>
              <div class="h-4 bg-slate-200 rounded w-5/6"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Recommendations -->
    <div id="recommendationsSection" class="hidden animate-fade-in">
      <h3 class="text-2xl font-bold mb-6 text-slate-900">🛠️ AI Recommendations</h3>
      <div id="recommendationsList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Dynamic content -->
      </div>
    </div>
  </main>

  <script type="module" src="src/js/pages/dev-ai-insights.js"></script>
</body>
</html>
