<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management | EduConnectZA Dev Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/dev-shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    * { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 antialiased">
  <nav class="gradient-bg text-white shadow-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-white p-2 rounded-xl shadow-inner">
            <i class="fas fa-school text-blue-800 text-lg"></i>
          </div>
          <span class="font-bold tracking-tight">Global School Management</span>
        </div>
        <button id="addSchoolBtn" class="bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
          <i class="fas fa-plus"></i> Register New School
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    
    <!-- GLOBAL TABS -->
    <div class="global-tab-bar mb-8">
      <a href="dev-admin-dashboard.html" class="global-tab"><i class="fas fa-th-large"></i> Overview</a>
      <a href="dev-user-management.html" class="global-tab"><i class="fas fa-users"></i> Users</a>
      <a href="dev-school-management.html" class="global-tab active"><i class="fas fa-school"></i> Schools</a>
      <a href="dev-ai-insights.html" class="global-tab"><i class="fas fa-brain"></i> AI Audit</a>
      <a href="dev-system-controls.html" class="global-tab"><i class="fas fa-server"></i> System</a>
      <a href="dev-content-management.html" class="global-tab"><i class="fas fa-book"></i> Content</a>
      <a href="dev-database-explorer.html" class="global-tab"><i class="fas fa-database"></i> Database</a>
    </div>

    <div class="mb-8">
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">🏫 School Infrastructure</h1>
      <p class="text-slate-500 mt-1">Lifecycle management and cluster assignment.</p>
    </div>

    <!-- School Grid -->
    <div id="schoolGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
      <!-- Dynamic content -->
      <div class="col-span-full text-center py-20 text-slate-400">Querying cluster for school nodes...</div>
    </div>
  </main>

  <!-- Add School Modal -->
  <div id="schoolModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-8 shadow-2xl relative">
      <button id="closeModal" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
      <h2 class="text-2xl font-black text-slate-900 mb-6">Register New School</h2>
      <form id="schoolForm" class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">School Name</label>
          <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="e.g. Riverside High">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Province</label>
          <select id="province" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
            <option value="GP">Gauteng</option>
            <option value="WC">Western Cape</option>
            <option value="KZN">KwaZulu-Natal</option>
            <option value="EC">Eastern Cape</option>
            <option value="FS">Free State</option>
            <option value="LP">Limpopo</option>
            <option value="MP">Mpumalanga</option>
            <option value="NW">North West</option>
            <option value="NC">Northern Cape</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Address</label>
          <textarea id="address" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition" rows="2"></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all">Create School Environment</button>
      </form>
    </div>
  </div>

  <script type="module" src="src/js/pages/dev-school-management.js"></script>
</body>
</html>
