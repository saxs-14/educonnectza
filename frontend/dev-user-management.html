<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global User Management | EduConnectZA Dev Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/dev-shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    * { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 antialiased">
  <nav class="gradient-bg text-white shadow-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-white p-2 rounded-xl shadow-inner">
            <i class="fas fa-users text-blue-800 text-lg"></i>
          </div>
          <span class="font-bold tracking-tight">Global User Management</span>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    
    <!-- GLOBAL TABS -->
    <div class="global-tab-bar mb-8">
      <a href="dev-admin-dashboard.html" class="global-tab"><i class="fas fa-th-large"></i> Overview</a>
      <a href="dev-user-management.html" class="global-tab active"><i class="fas fa-users"></i> Users</a>
      <a href="dev-school-management.html" class="global-tab"><i class="fas fa-school"></i> Schools</a>
      <a href="dev-ai-insights.html" class="global-tab"><i class="fas fa-brain"></i> AI Audit</a>
      <a href="dev-system-controls.html" class="global-tab"><i class="fas fa-server"></i> System</a>
      <a href="dev-content-management.html" class="global-tab"><i class="fas fa-book"></i> Content</a>
      <a href="dev-database-explorer.html" class="global-tab"><i class="fas fa-database"></i> Database</a>
    </div>

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">👥 User Oversight</h1>
        <p class="text-slate-500 mt-1">Manage accounts across all registered schools.</p>
      </div>
      <div class="flex gap-3 w-full md:w-auto">
        <div class="relative flex-1 md:w-80">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="userSearch" placeholder="Search accounts..." class="w-full pl-12 pr-4 py-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition shadow-sm">
        </div>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-8">
      <div class="glass-card p-6 rounded-3xl animate-fade-in">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Total Users</p>
        <p id="totalUsers" class="text-2xl md:text-3xl font-black text-slate-900">--</p>
      </div>
      <div class="glass-card p-6 rounded-3xl animate-fade-in" style="animation-delay: 0.1s">
        <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1">Learners</p>
        <p id="learnerCount" class="text-2xl md:text-3xl font-black text-blue-600">--</p>
      </div>
      <div class="glass-card p-6 rounded-3xl animate-fade-in" style="animation-delay: 0.2s">
        <p class="text-[10px] font-bold text-purple-400 uppercase tracking-widest mb-1">Teachers</p>
        <p id="teacherCount" class="text-2xl md:text-3xl font-black text-purple-600">--</p>
      </div>
      <div class="glass-card p-6 rounded-3xl animate-fade-in" style="animation-delay: 0.3s">
        <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mb-1">Active</p>
        <p id="activeNow" class="text-2xl md:text-3xl font-black text-emerald-600">--</p>
      </div>
    </div>

    <!-- User Table -->
    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
      <div class="responsive-table-container">
        <table class="w-full text-left border-collapse min-w-[800px]">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200">
              <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">User Details</th>
              <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Role</th>
              <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">School</th>
              <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Status</th>
              <th class="px-6 py-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- Dynamic rows -->
            <tr><td colspan="5" class="px-6 py-10 text-center text-slate-400">Initializing cluster connection...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex flex-col sm:flex-row justify-between items-center gap-4">
        <p class="text-xs font-medium text-slate-500">Showing <span id="displayedCount" class="text-slate-900 font-bold">0</span> of <span id="totalCount" class="text-slate-900 font-bold">0</span> users</p>
        <div class="flex gap-2">
          <button class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition">Previous</button>
          <button class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="src/js/pages/dev-user-management.js"></script>
</body>
</html>
