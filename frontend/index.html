<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnectZA - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <style>
    .morph-transition { transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .bg-pattern { background: radial-gradient(circle at 10% 20%, rgba(30,58,138,0.05) 0%, transparent 30%); }
    .loader { border-top-color: #1e3a8a; animation: spinner 0.8s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen bg-pattern">
  <div id="login-card" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md morph-transition">
    <div class="text-center mb-8">
      <img src="images/logo.png" alt="EduConnectZA" class="h-20 mx-auto">
      <h2 class="text-3xl font-bold text-gray-800 mt-2">Welcome Back</h2>
      <p class="text-gray-500">Sign in to continue</p>
    </div>
    <form id="login-form">
      <div class="mb-5">
        <label class="block text-gray-700 font-medium mb-1">Email</label>
        <input type="email" id="email" title="Email Address" placeholder="name@example.com" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" id="password" title="Password" placeholder="••••••••" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md flex items-center justify-center">
        <span class="loader ease-linear rounded-full border-2 border-t-2 border-white h-5 w-5 mr-2 hidden" id="login-spinner"></span>
        <span id="login-text">Log In</span>
      </button>
      <p class="mt-5 text-center text-gray-600">
        Don't have an account? <a href="signup.html" class="text-blue-600 hover:underline font-medium">Sign up</a>
      </p>
      <p class="text-center mt-2">
        <a href="forgot-password.html" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
      </p>
    </form>
    <div id="error-message" class="mt-4 text-red-500 text-sm hidden"></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script type="module" src="src/js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
