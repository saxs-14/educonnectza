<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnectZA - Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Set New Password</h2>
      <p class="text-gray-500 mt-2">Please enter your new password below.</p>
    </div>
    <form id="reset-password-form">
      <div class="mb-5">
        <label class="block text-gray-700 font-medium mb-1">New Password</label>
        <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
      </div>
      <div class="mb-5">
        <label class="block text-gray-700 font-medium mb-1">Confirm New Password</label>
        <input type="password" id="confirm-password" required minlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">
        Reset Password
      </button>
    </form>
    <div id="message" class="mt-4 text-center text-sm hidden"></div>
  </div>

<script type="module" src="src/js/reset-password.js"></script>
</body>
</html>
